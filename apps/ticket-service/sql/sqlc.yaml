version: "2"
sql:
  - engine: "postgresql"
    queries: "./query/"
    schema: "../migrations"
    gen:
      go:
        package: "db"
        out: "../internal/adapters/db/sqlc"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # Plain bytes rather than a driver-specific JSONB wrapper: the only
          # jsonb column is event_outbox.payload, which no sqlc query touches
          # (the outbox relay in internal/adapters/events uses raw SQL). Pointing
          # this at a pgtype package instead makes sqlc emit two conflicting
          # pgtype imports in models.go.
          - db_type: "jsonb"
            go_type:
              type: "byte"
              slice: true