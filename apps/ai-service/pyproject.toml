[project]
name = "ticket-management-ai-service"
version = "0.1.0"
description = "AI/RAG support-triage service for the ticket management system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "anthropic>=0.40.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.9",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Auto-generated code is not hand-maintained; don't lint it.
extend-exclude = ["alembic/versions", "app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Line length is owned by the formatter, not the linter; keeps lint focused on
# correctness/imports/modernization without churning long lines in existing code.
ignore = ["E501"]

