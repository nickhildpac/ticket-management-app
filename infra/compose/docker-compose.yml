# Compose topology (profiles):
#   (default) core → postgres + keycloak (IdP) + ticket-service (Go, authoritative) + web (Vite/React)
#   ai            → redis broker + ai-service (Go RAG API) + worker (triage consumer)
#   obs           → prometheus + grafana
#
# Run:
#   docker compose up                         # core
#   docker compose --profile ai up            # core + AI stack
#   docker compose --profile ai --profile obs up
# Paths are relative to this file (infra/compose/).

services:
  # ---- core -------------------------------------------------------------
  postgres:
    # pgvector image so the AI service can store embeddings in the same DB
    image: pgvector/pgvector:pg15
    container_name: ticket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Identity provider. Authoritative for authentication and for the admin/agent/user
  # realm roles; ticket-service is a pure resource server that validates its tokens.
  # The realm (clients, roles, dev users) is imported from infra/keycloak/realm-export.json
  # on first boot only — delete the keycloak_data volume to re-import after editing it.
  #
  # start-dev + the dev-file database are local-only. See infra/keycloak/README.md
  # for the production shape (start, KC_DB=postgres, TLS, injected secrets).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ticket-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens must carry the URL the *browser* uses, otherwise `iss` won't match
      # what the SPA and the API expect. Services reach the same realm in-network
      # via KEYCLOAK_INTERNAL_ISSUER_URL.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8080 on the host is taken by ticket-service.
      - "127.0.0.1:8090:8080"
    volumes:
      - ../../infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      - ticket-network
    healthcheck:
      # The image has no curl/wget; Keycloak 26 exposes health on the management
      # port (9000) and ships a JRE, so probe it with a tiny Java one-liner.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q 'UP'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Authoritative ticket-lifecycle service (Go). See docs/adr/0002-service-topology.md.
  ticket-service:
    build:
      context: ../../apps/ticket-service
      dockerfile: Dockerfile
    container_name: ticket-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 8080
      DB_ADDR: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ticket_management}?sslmode=disable
      # Issuer as it appears in `iss` (browser-facing) vs. where this container
      # actually fetches discovery/JWKS. See infra/keycloak/README.md.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}/realms/${KEYCLOAK_REALM:-ticket-management}
      KEYCLOAK_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ticket-management}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-ticket-service}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-ticket-web}
      # Enables writing realm role changes back via the Admin API (admin panel).
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-ticket-service}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-ticket-service-dev-secret}
      CookieDomain: ${COOKIE_DOMAIN:-localhost}
      # CORS origin = where the browser loads the web app from (host port 3000).
      FRONTEND_URL: ${WEB_ORIGIN:-http://localhost:3000}
      # Outbox relay target (see Phase 2/4); harmless if unused.
      REDIS_ADDR: redis:6379
      # ai-service base URL for the admin document-ingest proxy (profile "ai").
      AI_SERVICE_URL: http://ai-service:8081
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - ticket-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        # Web talks to the Go ticket service (authoritative API).
        VITE_API_URL: ${WEB_API_URL:-http://localhost:8080}
    container_name: ticket-web
    ports:
      - "3000:8080"
    depends_on:
      - ticket-service
    networks:
      - ticket-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ---- ai profile -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    profiles: ["ai"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # AI/RAG support-triage service (Go). Serves on-demand triage and the
  # knowledge-base ingest endpoint the ticket-service proxies to; the `worker`
  # service below is the primary event-driven triage path.
  ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    container_name: ticket-ai-service
    profiles: ["ai"]
    # Loads OPENAI_API_KEY / EMBEDDING_MODEL from the app .env. Explicit
    # environment: entries below override host-local values (e.g. DATABASE_URL).
    env_file:
      - ../../apps/ai-service/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ticket_management}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TICKET_SERVICE_URL: http://ticket-service:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-opus-4-8}
      AUTO_ANSWER_CONFIDENCE_THRESHOLD: ${AUTO_ANSWER_CONFIDENCE_THRESHOLD:-0.75}
      # Inbound token validation on /triage and /ingest: `iss` is the
      # browser-facing URL, discovery/JWKS come from the in-network one.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}/realms/${KEYCLOAK_REALM:-ticket-management}
      KEYCLOAK_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ticket-management}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-ticket-service}
      # Outbound: callbacks into ticket-service authenticate with a Keycloak
      # client_credentials token, not a shared signing secret.
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ticket-management}/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: ${AI_KEYCLOAK_CLIENT_ID:-ai-service}
      KEYCLOAK_CLIENT_SECRET: ${AI_KEYCLOAK_CLIENT_SECRET:-ai-service-dev-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-20}
      RAG_RERANK_POOL: ${RAG_RERANK_POOL:-10}
      RRF_K: ${RRF_K:-60}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cohere/rerank-v3.5}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ticket-service:
        condition: service_started
    networks:
      - ticket-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # AI triage worker: consumes the `ticket-events` Redis stream and applies
  # triage decisions via callback into ticket-service. Same image/env as
  # ai-service, just a different entrypoint — the API process does not consume
  # events on its own.
  worker:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    container_name: ticket-ai-worker
    profiles: ["ai"]
    command: ["./worker"]
    env_file:
      - ../../apps/ai-service/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ticket_management}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TICKET_SERVICE_URL: http://ticket-service:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-opus-4-8}
      AUTO_ANSWER_CONFIDENCE_THRESHOLD: ${AUTO_ANSWER_CONFIDENCE_THRESHOLD:-0.75}
      # Inbound token validation on /triage and /ingest: `iss` is the
      # browser-facing URL, discovery/JWKS come from the in-network one.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}/realms/${KEYCLOAK_REALM:-ticket-management}
      KEYCLOAK_INTERNAL_ISSUER_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ticket-management}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-ticket-service}
      # Outbound: callbacks into ticket-service authenticate with a Keycloak
      # client_credentials token, not a shared signing secret.
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ticket-management}/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: ${AI_KEYCLOAK_CLIENT_ID:-ai-service}
      KEYCLOAK_CLIENT_SECRET: ${AI_KEYCLOAK_CLIENT_SECRET:-ai-service-dev-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-20}
      RAG_RERANK_POOL: ${RAG_RERANK_POOL:-10}
      RRF_K: ${RRF_K:-60}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cohere/rerank-v3.5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ticket-service:
        condition: service_started
    networks:
      - ticket-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---- obs profile ------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ticket-prometheus
    profiles: ["obs"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ticket-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ticket-grafana
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - ticket-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  # Explicitly named so `make keycloak-reset` can remove it without depending on
  # the compose project name.
  keycloak_data:
    name: ticket-keycloak-data
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  ticket-network:
    driver: bridge
