name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  contracts-drift:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Go
      # Needed so the generator can run gofmt on the Go artifact.
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.5'

    - name: Regenerate contract artifacts
      run: python tools/generate_ticket_state_contract.py

    - name: Fail on drift
      run: |
        if ! git diff --quiet; then
          echo "Generated contract artifacts are out of date. Run 'make contracts' and commit."
          git --no-pager diff
          exit 1
        fi

  test-ticket-service:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.5'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      working-directory: ./apps/ticket-service
      run: go mod download

    - name: Run tests
      working-directory: ./apps/ticket-service
      run: go test -v -cover ./...
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: ticket_management_test

  test-ai-service:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      working-directory: ./apps/ai-service
      run: uv sync --extra dev

    - name: Run linting
      working-directory: ./apps/ai-service
      run: uv run ruff check .

    - name: Run tests
      working-directory: ./apps/ai-service
      run: uv run pytest

  test-web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      working-directory: ./apps/web
      run: bun install --frozen-lockfile

    - name: Run type check + build
      working-directory: ./apps/web
      run: bun run build

    - name: Run linting
      working-directory: ./apps/web
      run: bun run lint

  build-and-push:
    needs: [contracts-drift, test-ticket-service, test-ai-service, test-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - name: ticket-service
            context: ./apps/ticket-service
          - name: ai-service
            context: ./apps/ai-service
          - name: web
            context: ./apps/web

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push ${{ matrix.name }} image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploy to production server"
        echo "You would typically SSH into your server here"
        echo "Pull the latest images and restart services"

        # Example commands you would run on your server:
        # docker compose -f infra/compose/docker-compose.yml pull
        # docker compose -f infra/compose/docker-compose.yml up -d
        # docker system prune -f
